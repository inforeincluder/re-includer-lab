title: "2e Lab Brasil"
description: "Ciência, neurodiversidade, dupla excepcionalidade e ferramentas práticas para famílias, pessoas neurodivergentes e educadores."
author: "2e Lab Brasil"
logo: "/assets/images/2e-lab-logo.jpg"

url: "https://inforeincluder.github.io"
baseurl: "/re-includer-lab"

lang: "pt-BR"
timezone: "America/Recife"

# Métricas de audiência e verificação do Search Console.
goatcounter_url: "https://2elabbrasil.goatcounter.com/count"
google_site_verification: "b5CRlpsUahBi8j0CJgubZWG7pnz270FGFybMivmq5eo"

theme: minima

markdown: kramdown
permalink: /:categories/:title/

header_pages:
  - artigos.md
  - categorias.md
  - tags.md
  - sobre.md
  - pesquisa.md
  - ferramentas.md
  - fontes-e-metodologia.md
  - visibilidade-ia.md
  - calendario-editorial.md
  - transparencia-comercial.md
  - privacidade.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

show_excerpts: true

# Taxonomia editorial oficial: categorias principais do 2e Lab Brasil.
taxonomy_categories:
  - slug: autismo
    name: Autismo
    description: Informação baseada em evidências sobre autismo, desenvolvimento, comunicação, participação e apoios.
  - slug: tdah
    name: TDAH
    description: Ciência e estratégias práticas sobre atenção, impulsividade, autorregulação e funções executivas.
  - slug: altas-habilidades-superdotacao
    name: Altas habilidades e superdotação
    description: Potencialidades, identificação, desenvolvimento de talentos e educação de pessoas com altas habilidades ou superdotação.
  - slug: dupla-excepcionalidade
    name: Dupla excepcionalidade (2e)
    description: Coexistência de altas habilidades ou potencial elevado com condições que geram necessidades específicas de apoio.
  - slug: dislexia-aprendizagem
    name: Dislexia e dificuldades de aprendizagem
    description: Evidências e práticas sobre dislexia, aprendizagem, alfabetização e barreiras educacionais.
  - slug: neurodivergencia-adulta
    name: Neurodivergência adulta
    description: Experiências, identificação, trabalho, autonomia e qualidade de vida de adultos neurodivergentes.
  - slug: cognicao-funcoes-executivas
    name: Cognição e funções executivas
    description: Atenção, memória, planejamento, flexibilidade cognitiva, aprendizagem e autorregulação.
  - slug: tecnologia-assistiva
    name: Tecnologia assistiva
    description: Recursos, adaptações e tecnologias para ampliar comunicação, aprendizagem, autonomia e participação.
  - slug: ia-acessibilidade
    name: IA e acessibilidade
    description: Inteligência artificial aplicada à acessibilidade, inclusão, personalização e apoio à neurodiversidade.
  - slug: educacao-inclusao
    name: Educação e inclusão
    description: Práticas pedagógicas, acessibilidade, direitos, participação e colaboração entre família e escola.
  - slug: saude-bem-estar
    name: Saúde e bem-estar
    description: Saúde mental, desenvolvimento, sono, bem-estar e cuidado informado, sem substituir orientação profissional.
  - slug: trabalho-politicas-publicas
    name: Trabalho e políticas públicas
    description: Direitos, inclusão no trabalho, políticas públicas, serviços e participação social.
