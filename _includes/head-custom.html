<!-- Dados leves para recomendações editoriais locais; sem serviços externos. -->
<script type="application/json" id="site-related-posts-data">
[
{% for post in site.posts %}
  {
    "title": {{ post.title | jsonify }},
    "url": {{ post.url | relative_url | jsonify }},
    "date": {{ post.date | date_to_xmlschema | jsonify }},
    "categories": {{ post.categories | jsonify }},
    "tags": {{ post.tags | jsonify }},
    "description": {{ post.description | default: post.excerpt | strip_html | normalize_whitespace | truncate: 180 | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
]
</script>
