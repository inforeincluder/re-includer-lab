name: Divulgacao automatica no X via Buffer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_x_buffer.py'
      - '.github/workflows/divulgacao-x-buffer.yml'
  schedule:
    - cron: "30 12 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buffer-x-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe do publicador
        run: python -m py_compile scripts/publish_x_buffer.py

      - name: Publicar próximo artigo elegível no Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          X_HANDLE: 2eLabBrasil
        run: python scripts/publish_x_buffer.py
