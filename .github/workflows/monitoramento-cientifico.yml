name: Monitoramento científico

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monitoramento-cientifico.yml
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 11 * * 2,5"
  workflow_dispatch:

concurrency:
  group: monitoramento-cientifico-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Validar código e workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar script e executar testes
        run: |
          python -m py_compile scripts/monitorar_estudos.py scripts/monitorar_fontes_publicas.py tests/test_monitorar_estudos.py
          python -m unittest discover -s tests -v

      - name: Validar sintaxe YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "YAML válido: #{file}" }' \
            _config.yml \
            .github/workflows/monitoramento-cientifico.yml \
            .github/workflows/jekyll-gh-pages.yml

  buscar-e-preparar-rascunhos:
    name: Buscar estudos e preparar rascunhos
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar base com main para evitar rascunhos duplicados
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Buscar estudos e gerar rascunhos
        env:
          GEMINI_API_KEY: ${{ secrets.reincluder_lab }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-2.5-flash
          MAX_ARTICLES: "3"
        run: python scripts/monitorar_estudos.py

      - name: Descobrir pautas em fontes públicas e preparar rascunhos
        env:
          GEMINI_API_KEY: ${{ secrets.reincluder_lab }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-2.5-flash
          MAX_PUBLIC_ITEMS: "2"
          PUBLIC_LOOKBACK_DAYS: "14"
        run: python scripts/monitorar_fontes_publicas.py

      - name: Salvar rascunhos em main para revisão humana (sem publicar)
        run: |
          git fetch origin main
          git checkout --detach origin/main
          if ! find _drafts -maxdepth 1 -type f -name '*.md' -print -quit 2>/dev/null | grep -q .; then
            echo "Nenhum arquivo de rascunho novo para salvar."
            exit 0
          fi
          git add _drafts/*.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova em _drafts/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Adiciona rascunhos científicos para revisão humana"
          git push origin HEAD:main

